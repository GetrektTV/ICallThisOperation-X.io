<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="./styles.css">
    <style>
        body {
            background-color: navy;
            color: white;
            text-align: center;
            font-family: "Brush Script MT", cursive;
            overflow: hidden;
        }
        .container {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translate(-50%, 0);
        }
        .header_text {
            font-size: 2.5em;
            text-shadow: 0 0 15px white;
            margin: 10px;
        }
        .gif_container img {
            width: 200px;
            height: auto;
            margin-top: 20px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            position: relative;
        }
        .btn {
            font-size: 1.5em;
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            transition: 0.3s;
        }
        #yesButton {
            background-color: lime;
            color: black;
            box-shadow: 0 0 10px lime;
        }
        #noButton {
            background-color: red;
            color: white;
            position: absolute;
        }
        #confetti, #hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="confetti"></canvas>
    <canvas id="hearts"></canvas>
    <div class="container">
        <h1 class="header_text">Hey Xyvin</h1>
        <h1 class="header_text">Do You Wanna Be My Valentine?</h1>
        <div class="gif_container">
            <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExdXdqZ3UxaGxkNHp1NzlkNTF2cXFtOWtuYmFwMWFkdWs5ZXJla3N1NyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/c76IJLufpNwSULPk77/giphy.gif" alt="Cute animated illustration">
        </div>
        <div class="buttons">
            <button class="btn" id="yesButton" onclick="nextPage()">Yes</button>
            <button class="btn" id="noButton" onmouseover="moveButton()" onclick="moveButton()">No</button>
        </div>
    </div>

    <script>
        function nextPage() {
            window.location.href = "yes.html";
        }

        let moveCount = 0;
        function moveButton() {
            var button = document.getElementById('noButton');
            var maxX = window.innerWidth - button.offsetWidth;
            var maxY = window.innerHeight - button.offsetHeight;
            
            let currentX = button.offsetLeft;
            let currentY = button.offsetTop;
            
            let newX = currentX + (Math.random() * 50 - 25);
            let newY = currentY + (Math.random() * 50 - 25);
            
            newX = Math.max(0, Math.min(maxX, newX));
            newY = Math.max(0, Math.min(maxY, newY));
            
            button.style.left = `${newX}px`;
            button.style.top = `${newY}px`;
            
            moveCount++;
            if (moveCount >= 15) {
                button.style.display = 'none';
            }
        }

        function createParticles(canvasId, emoji) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext("2d");
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    speed: Math.random() * 2 + 1,
                    size: Math.random() * 20 + 10,
                    opacity: Math.random() * 0.5 + 0.5
                });
            }

            function drawParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.font = "20px Arial";
                for (let p of particles) {
                    ctx.globalAlpha = p.opacity;
                    ctx.fillText(emoji, p.x, p.y);
                    p.y += p.speed;
                    if (p.y > canvas.height) p.y = -20;
                }
                requestAnimationFrame(drawParticles);
            }

            drawParticles();
        }

        createParticles("confetti", "🎉");
        createParticles("hearts", "💙");
    </script>
</body>
</html>
