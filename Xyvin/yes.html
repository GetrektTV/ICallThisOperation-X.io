<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="./yes_style.css">
        <style>
            body {
                background-color: #2ecc71;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
                overflow: hidden;
            }
            .container {
                text-align: center;
            }
            .header_text {
                color: white;
                font-size: 3rem;
                font-weight: bold;
            }
            .confetti {
                position: fixed;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 999;
            }
        </style>
    </head> 
    <body>
        <canvas class="confetti"></canvas>
        <div class="container">
            <h1 class="header_text">Hurrayyyy!!</h1>
            <div class="gif_container">
                <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExMDZtOXJvaDd4bzJheDBxa3VkamxydTMwNjluczd6aG51MjBlb2RpeiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/lSbTmUmQwxUmiExV4h/giphy.gif" alt="Cute animated illustration">
            </div>
        </div>
        <script>
            const canvas = document.querySelector(".confetti");
            const ctx = canvas.getContext("2d");
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const confettiPieces = Array.from({ length: 150 }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 6 + 2,
                d: Math.random() * 2 + 1,
                color: `hsl(${Math.random() * 360}, 100%, 50%)`,
            }));
            
            function drawConfetti() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                confettiPieces.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2, false);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                });
                updateConfetti();
            }
            
            function updateConfetti() {
                confettiPieces.forEach(p => {
                    p.y += p.d;
                    if (p.y > canvas.height) {
                        p.y = 0;
                        p.x = Math.random() * canvas.width;
                    }
                });
                requestAnimationFrame(drawConfetti);
            }
            drawConfetti();
        </script>
    </body> 
</html>
